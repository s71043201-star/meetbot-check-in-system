<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:2500px; height:1686px; overflow:hidden;
    font-family:"Microsoft JhengHei","微軟正黑體","Noto Sans TC",sans-serif;
  }
  .grid {
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
    width:2500px; height:1686px;
  }
  .cell {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px;
    position:relative; overflow:hidden;
    border:2px solid rgba(255,255,255,0.15);
    background-size:cover; background-position:center;
  }
  /* 各格獨立背景圖 */
  .c1 { background-image: url('bg_weekly.jpg'); }
  .c2 { background-image: url('bg_work.jpg'); }
  .c3 { background-image: url('bg_meet.jpg'); }
  .c4 { background-image: url('bg_help.jpg'); }
  /* 文字可讀用暗色遮罩 */
  .cell::before {
    content:''; position:absolute; inset:0;
    background: rgba(0,0,0,0.45);
  }
  .icon {
    font-size:160px; line-height:1; position:relative; z-index:1;
    filter:drop-shadow(0 6px 24px rgba(0,0,0,0.7));
  }
  .title {
    color:#fff; font-size:130px; font-weight:700; letter-spacing:6px;
    position:relative; z-index:1;
    text-shadow:0 4px 20px rgba(0,0,0,0.8);
  }
  .sub {
    color:rgba(255,255,255,0.85); font-size:64px; font-weight:400; letter-spacing:3px;
    position:relative; z-index:1;
    text-shadow:0 2px 12px rgba(0,0,0,0.7);
  }
</style>
</head>
<body>
<div class="grid">
  <div class="cell c1">
    <div class="icon">📊</div>
    <div class="title">週報</div>
    <div class="sub">週報統計系統</div>
  </div>
  <div class="cell c2">
    <div class="icon">📋</div>
    <div class="title">工作</div>
    <div class="sub">查看我的待辦</div>
  </div>
  <div class="cell c3">
    <div class="icon">💻</div>
    <div class="title">Meetbot</div>
    <div class="sub">任務追蹤系統</div>
  </div>
  <div class="cell c4">
    <div class="icon">❓</div>
    <div class="title">指令說明</div>
    <div class="sub">查看所有指令</div>
  </div>
</div>
</body>
</html>
